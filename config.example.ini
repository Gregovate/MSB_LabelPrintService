[database]
host=192.168.5.9
port=5432
dbname=msb
user=printservice
password=ChangeMeNow

[service]
poll_seconds = 15
started_by_person_id = 17
started_by_text = Greg Liebig

# Current production printer used by v3.x Display/Container printing.
# Future template-aware runtime selection must remain service-owned; normal
# operators should not choose a Windows printer.
[printer]
name = Brother PT-P950NW

[paths]
base_dir = C:\MSB_LabelService
sql_dir = C:\MSB_LabelService\sql
csv_dir = C:\MSB_LabelService\csv
template_dir = C:\MSB_LabelService\templates
state_dir = C:\MSB_LabelService\state
log_dir = C:\MSB_LabelService\logs

# Compatibility keys consumed by current v3.x code. These now point to the
# accepted printer-specific source/runtime folder. Display defaults to the
# current standard 36 mm format until database-driven template selection is
# deployed and accepted.
[templates]
display = C:\MSB_LabelService\templates\pt_p950nw\QR_display_labels_2_line_36mm.lbx
container_vertical = C:\MSB_LabelService\templates\pt_p950nw\QR_container_vertical_36mm.lbx
container_horizontal = C:\MSB_LabelService\templates\pt_p950nw\QR_container_horizontal_36mm.lbx

[csv_files]
display = C:\MSB_LabelService\csv\display_labels.csv
container_vertical = C:\MSB_LabelService\csv\container_labels_vertical.csv
container_horizontal = C:\MSB_LabelService\csv\container_labels_horizontal.csv

[printing]
mode = open_template
display_command =
container_vertical_command =
container_horizontal_command =
