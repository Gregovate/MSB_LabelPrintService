[database]
host = 192.168.5.9
port = 5432
dbname = msb
user = printservice
password = ChangeMeNow

[service]
poll_seconds = 15
started_by_person_id = 17
started_by_text = Greg Liebig

[features]
# Conservative source default. Enable only in the controlled production
# configuration after the database, media, and physical-test gates pass.
controller_polling_enabled = false

[paths]
base_dir = C:\MSB_LabelService
sql_dir = C:\MSB_LabelService\sql
csv_dir = C:\MSB_LabelService\csv
state_dir = C:\MSB_LabelService\state
log_dir = C:\MSB_LabelService\logs

[printer.pt_p950nw]
queue_name = Brother PT-P950NW
host = 192.168.5.12
template_dir = C:\MSB_LabelService\templates\pt_p950nw

[printer.ql_820nwb]
queue_name = Brother QL-820NWB
host = 192.168.5.11
template_dir = C:\MSB_LabelService\templates\ql_820nwb
enabled = false

[label_family.QR_36MM_HORIZONTAL]
printer = pt_p950nw
media_width_mm = 36
media_type = LAMINATED_TAPE
orientation = HORIZONTAL
template_1_line = QR_label_1_line_horz_36mm.lbx
template_2_line = QR_label_2_line_horz_36mm.lbx

[label_family.QR_24MM_HORIZONTAL]
printer = pt_p950nw
media_width_mm = 24
media_type = LAMINATED_TAPE
orientation = HORIZONTAL
template_1_line = QR_label_1_line_horz_24mm.lbx
template_2_line = QR_label_2_line_horz_24mm.lbx

[label_family.QR_36MM_VERTICAL]
printer = pt_p950nw
media_width_mm = 36
media_type = LAMINATED_TAPE
orientation = VERTICAL
template_1_line = QR_label_1_line_vert_36mm.lbx
template_2_line =

[label_family.WIRING_12MM_HORIZONTAL]
printer = pt_p950nw
media_width_mm = 12
media_type = LAMINATED_TAPE
orientation = HORIZONTAL
template_1_line =
template_2_line = wiring_label_2_line_horz_12mm_double_sided.lbx

[csv_files]
display = C:\MSB_LabelService\csv\display_labels.csv
container_vertical = C:\MSB_LabelService\csv\container_labels_vertical.csv
container_horizontal = C:\MSB_LabelService\csv\container_labels_horizontal.csv
controller = C:\MSB_LabelService\csv\controller_labels.csv

[printing]
mode = bpac
snmp_oid = 1.3.6.1.4.1.2435.3.3.9.1.6.1.0
snmp_community = public
snmp_port = 161
snmp_timeout_seconds = 3.0
# Observation-only capture for PT-P950NW status changes during active jobs.
# This does not stop printing or assign meaning to unknown status bytes.
status_sampler_enabled = true
status_sample_interval_seconds = 0.25
status_heartbeat_seconds = 5.0
status_post_spooler_seconds = 2.0
